<style>
:root{
  --sky-25:#FBFDFF; --sky-50:#F5FBFF; --sky-100:#EAF6FF; --sky-150:#E1F2FE;
  --sky-200:#D6EEFF; --sky-300:#B9E2FA; --sky-400:#8FCDF0;
  --accent:#6BB8E8; --accent-strong:#4A9ED6; --accent-deep:#2E7FAE;
  --white:#FFFFFF; --paper:#F9FCFF;
  --ink:#1E293B; --ink-2:#334155; --ink-3:#64748B; --ink-4:#94A3B8;
  --line:#E3F2FC; --line-2:#D3E9F7;
  --shadow-m:0 2px 6px rgba(46,127,174,.08), 0 12px 30px rgba(74,158,214,.12);
  --shadow-l:0 8px 40px rgba(46,127,174,.18);
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.55; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:calc(28px + var(--safe-t)) 20px calc(28px + var(--safe-b));
  background:
    radial-gradient(1100px 620px at 8% -10%, #E7F5FF 0%, rgba(231,245,255,0) 62%),
    radial-gradient(900px 520px at 104% 8%, #F2FAFF 0%, rgba(242,250,255,0) 58%),
    linear-gradient(180deg,#F2FAFF 0%, #FBFDFF 46%, #F5FBFF 100%);
  background-attachment:fixed;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
input{outline:none}

.wrap{width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center}

.card{
  position:relative; width:100%;
  background:var(--white);
  border:1px solid var(--line-2);
  border-radius:28px;
  box-shadow:var(--shadow-m), 0 1px 0 #fff inset;
  padding:30px 22px 22px;
  text-align:center;
}
.card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}
  40%,60%{transform:translateX(7px)}
}
@media (prefers-reduced-motion:reduce){ .card.shake{animation:none} }

.mark{
  width:74px; height:74px; margin:0 auto 14px;
  border-radius:50%;
  background:linear-gradient(180deg,#FFFFFF 0%, #EAF6FF 100%);
  border:1px solid var(--sky-200);
  box-shadow:0 6px 18px rgba(74,158,214,.14);
  display:flex; align-items:center; justify-content:center;
  font-size:35px; line-height:1;
}
h1{
  margin:0; font-size:22px; font-weight:800; letter-spacing:-.03em; color:var(--ink);
}
.badge{
  display:inline-block; margin-top:9px;
  padding:5px 13px; border-radius:999px;
  background:var(--sky-50); border:1px solid var(--sky-200);
  color:var(--accent-deep); font-size:12px; font-weight:600; letter-spacing:-.01em;
}

form{margin:22px 0 0}
.pw{
  width:100%; height:56px;
  border:1.5px solid var(--sky-200);
  background:var(--paper);
  border-radius:16px;
  text-align:center;
  font-size:22px; font-weight:600;
  letter-spacing:.42em; text-indent:.42em;
  color:var(--ink);
  -webkit-appearance:none; appearance:none;
  transition:border-color .16s, box-shadow .16s, background .16s;
}
.pw::placeholder{font-size:15px; font-weight:500; letter-spacing:0; text-indent:0; color:var(--ink-4)}
.pw:focus{
  border-color:var(--sky-400); background:#fff;
  box-shadow:0 0 0 4px rgba(143,205,240,.22);
}

.remember{
  display:flex; align-items:center; gap:9px;
  margin:14px 2px 0; padding:2px 0;
  font-size:13.5px; color:var(--ink-2); font-weight:500;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  text-align:left;
}
.remember input{
  -webkit-appearance:none; appearance:none;
  width:20px; height:20px; margin:0; flex:0 0 20px;
  border:1.5px solid var(--sky-300); border-radius:7px;
  background:#fff; position:relative; cursor:pointer;
  transition:background .14s, border-color .14s;
}
.remember input:checked{
  background:var(--accent-strong); border-color:var(--accent-strong);
}
.remember input:checked::after{
  content:""; position:absolute; left:6px; top:2px;
  width:5px; height:10px;
  border:solid #fff; border-width:0 2.2px 2.2px 0;
  transform:rotate(43deg);
}
.remember input:focus-visible{box-shadow:0 0 0 4px rgba(143,205,240,.28)}

.err{
  display:none; margin:13px auto 0;
  padding:9px 14px; border-radius:12px;
  background:#FFF5F5; border:1px solid #FBDCDC;
  color:#C2564F; font-size:13px; font-weight:600;
}
.err.on{display:block}
.note{
  display:none; margin:13px auto 0;
  padding:9px 14px; border-radius:12px;
  background:var(--sky-50); border:1px solid var(--sky-200);
  color:var(--accent-deep); font-size:12.5px; font-weight:600; line-height:1.45;
}
.note.on{display:block}

.open{
  width:100%; height:56px; margin-top:18px;
  border-radius:16px;
  background:linear-gradient(180deg,#6BB8E8 0%, #4A9ED6 100%);
  color:#fff; font-size:17px; font-weight:700; letter-spacing:-.01em;
  box-shadow:0 8px 20px rgba(74,158,214,.32), 0 1px 0 rgba(255,255,255,.4) inset;
  transition:transform .12s, box-shadow .12s, opacity .12s;
}
.open:active{transform:scale(.985); box-shadow:0 4px 12px rgba(74,158,214,.28)}
.open[disabled]{opacity:.72; box-shadow:0 6px 14px rgba(74,158,214,.22); cursor:default}
.open:focus-visible{outline:none; box-shadow:0 0 0 4px rgba(143,205,240,.35)}

.hint{
  margin:14px 0 0; font-size:11.5px; color:var(--ink-4); letter-spacing:-.01em;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.hint svg{width:12px; height:12px; flex:0 0 12px}
.foot{
  margin-top:16px; font-size:11px; color:var(--ink-4); text-align:center;
  letter-spacing:-.01em;
}
body.checking .pw, body.checking .remember{opacity:.4; pointer-events:none}
body.checking .open{opacity:.6; pointer-events:none}
</style>

<script>
(function(){
  'use strict';

  var LS_KEY   = 'bakingNote.lock.v1';
  var OLD_KEYS = ['butterNote.lock.v1'];

  var card  = document.getElementById('card');
  var form  = document.getElementById('lockform');
  var pw    = document.getElementById('pw');
  var chk   = document.getElementById('remember');
  var err   = document.getElementById('errmsg');
  var note  = document.getElementById('note');
  var btn   = document.getElementById('openBtn');

  var SALT, IV, CT, ITER, DATA;
  try{
    DATA = JSON.parse(document.getElementById('lockdata').textContent);
    SALT = b64ToBytes(DATA.salt);
    IV   = b64ToBytes(DATA.iv);
    CT   = b64ToBytes(DATA.ct);
    ITER = DATA.it | 0;
  }catch(e){ /* handled below */ }

  function b64ToBytes(b64){
    var bin = atob(String(b64).replace(/\s+/g,''));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes){
    var s = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk){
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  var subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  var encoder = new TextEncoder();
  var decoder = new TextDecoder('utf-8');

  function keyFromPassword(password){
    return subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return subtle.deriveKey(
          { name:'PBKDF2', salt:SALT, iterations:ITER, hash:'SHA-256' },
          base,
          { name:'AES-GCM', length:256 },
          true,                 /* extractable: only so the key (never the password) can be remembered on this device */
          ['decrypt']
        );
      });
  }

  function keyFromRaw(b64){
    return subtle.importKey('raw', b64ToBytes(b64), { name:'AES-GCM', length:256 }, true, ['decrypt']);
  }

  function decryptToHtml(key){
    return subtle.decrypt({ name:'AES-GCM', iv:IV, tagLength:128 }, key, CT).then(function(buf){
      var html = decoder.decode(buf);
      if (!/^\s*<!DOCTYPE html/i.test(html) || html.length < 1000) throw new Error('payload');
      return html;
    });
  }

  function launch(html){
    /* Replace this document with the decrypted app so its scripts, styles and storage run natively.
       document.open() only swaps the document once the parser has finished, so wait for load. */
    var write = function(){
      document.open();
      document.write(html);
      document.close();
    };
    if (document.readyState === 'complete') write();
    else window.addEventListener('load', write, { once:true });
  }

  function storeKey(key){
    try{
      return subtle.exportKey('raw', key).then(function(raw){
        localStorage.setItem(LS_KEY, JSON.stringify({
          v: 1, k: bytesToB64(new Uint8Array(raw)), t: Date.now()
        }));
      })['catch'](function(){});
    }catch(e){ return Promise.resolve(); }
  }

  function forgetKey(){
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    OLD_KEYS.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  }

  function readKey(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.v === 1 && obj.k) ? obj.k : null;
    }catch(e){ return null; }
  }

  function showError(){
    err.classList.add('on');
    card.classList.remove('shake');
    void card.offsetWidth;          /* restart the animation */
    card.classList.add('shake');
    pw.value = '';              /* let her type the code again straight away */
  }

  function clearError(){
    err.classList.remove('on');
    note.classList.remove('on');
    card.classList.remove('shake');
  }

  function busy(on){
    btn.disabled = !!on;
    btn.textContent = on ? '여는 중…' : '열기';
  }

  function ready(){
    document.body.classList.remove('checking');
  }

  /* ---- 0) Broken or truncated file ---- */
  var BROKEN = (!DATA || !CT || !CT.length || !SALT || !IV || !(ITER > 0));
  if (BROKEN){
    err.textContent = '파일이 손상되어 열 수 없어요. 새 파일을 다시 받아 주세요.';
    err.classList.add('on');
    pw.disabled = true;
    btn.disabled = true;
    return;
  }

  /* ---- 1) Try the key remembered on this device ---- */
  var savedKey = readKey();
  if (savedKey && subtle){
    document.body.classList.add('checking');
    keyFromRaw(savedKey)
      .then(decryptToHtml)
      .then(function(html){
        launch(html);
      })
      ['catch'](function(){
        forgetKey();
        ready();
        note.classList.add('on');
      });
  } else {
    if (savedKey && !subtle) forgetKey();
    ready();
  }

  /* ---- 2) Manual unlock ---- */
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (!subtle){
      err.textContent = '이 브라우저에서는 잠금을 열 수 없어요. 사파리나 크롬에서 열어 주세요.';
      err.classList.add('on');
      return;
    }
    var password = pw.value;
    if (!password){ pw.focus(); return; }
    clearError();
    busy(true);

    keyFromPassword(password)
      .then(function(key){
        return decryptToHtml(key).then(function(html){
          var remember = !!chk.checked;
          if (remember){
            storeKey(key).then(function(){ launch(html); }, function(){ launch(html); });
          } else {
            forgetKey();
            launch(html);
          }
        });
      })
      ['catch'](function(){
        busy(false);
        showError();
      });
  });

  pw.addEventListener('input', function(){
    if (err.classList.contains('on')) clearError();
  });

  /* Any failed attempt always returns to the lock screen. */
  window.addEventListener('pageshow', function(){ ready(); });
})();
</script>
</body>
